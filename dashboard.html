<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBaSr9WW9jm8xzw2qD6B8nfiTUKDDr6ulc",
    authDomain: "project-chel.firebaseapp.com",
    projectId: "project-chel",
    storageBucket: "project-chel.firebasestorage.app",
    messagingSenderId: "121409021229",
    appId: "1:121409021229:web:233de23c2abde564af1fa4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.chelIsEditor = false;

  window.chelFirebase = {
    onPartsStateChange(callback){
      const ref = doc(db, 'chel', 'partsState');
      return onSnapshot(ref, (snap) => {
        callback(snap.exists() ? (snap.data().data || {}) : {});
      }, (err) => { console.error('partsState listener error', err); });
    },
    onBuildStepsChange(callback){
      const ref = doc(db, 'chel', 'buildSteps');
      return onSnapshot(ref, (snap) => {
        callback(snap.exists() ? (snap.data().data || {}) : {});
      }, (err) => { console.error('buildSteps listener error', err); });
    },
    async setBuildSteps(obj){
      try{
        const clean = JSON.parse(JSON.stringify(obj));
        await setDoc(doc(db, 'chel', 'buildSteps'), { data: clean });
        return true;
      }catch(e){
        console.error('setBuildSteps failed', e);
        return false;
      }
    },
    onResolvedIssuesChange(callback){
      const ref = doc(db, 'chel', 'resolvedIssues');
      return onSnapshot(ref, (snap) => {
        callback(snap.exists() ? (snap.data().data || []) : []);
      }, (err) => { console.error('resolvedIssues listener error', err); });
    },
    async setResolvedIssues(arr){
      try{
        const clean = JSON.parse(JSON.stringify(arr));
        await setDoc(doc(db, 'chel', 'resolvedIssues'), { data: clean });
        return true;
      }catch(e){
        console.error('setResolvedIssues failed', e);
        return false;
      }
    },
    async login(email, password){
      try{
        await signInWithEmailAndPassword(auth, email, password);
        return { ok: true };
      }catch(e){
        return { ok: false, message: e.message };
      }
    },
    async logout(){
      await signOut(auth);
    }
  };

  onAuthStateChanged(auth, (user) => {
    window.chelIsEditor = !!user;
    window.dispatchEvent(new CustomEvent('chel-auth-changed', { detail: { loggedIn: !!user, email: user ? user.email : null } }));
  });

  window.dispatchEvent(new Event('chel-firebase-ready'));
</script>

  .progress-card{
    background:var(--panel); border:1px solid var(--brass); border-radius:6px;
    padding:22px; margin-bottom:26px;
  }
  .progress-top{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px;}
  .progress-pct{font-family:'IBM Plex Mono',monospace; font-size:2.4rem; font-weight:600; color:var(--brass);}
  .progress-label{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:2px; font-size:1rem;}
  .progress-sub{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--muted);}

  }
  .progress-fill{

  .milestone > summary::-webkit-details-marker{display:none;}

  .milestone[open] > summary::before{transform:rotate(90deg);}

<script>
function chelToggleLoginForm(){
  const form = document.getElementById('authLoginForm');
  form.style.display = form.style.display === 'none' ? 'flex' : 'none';
}

async function chelDoLogin(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter email and password.'; return; }
  const result = await window.chelFirebase.login(email, password);
  if(!result.ok){
    errEl.textContent = 'Login failed — check email/password.';
  }
}

async function chelDoLogout(){
  await window.chelFirebase.logout();
}

function chelUpdateAuthUI(detail){
  const statusEl = document.getElementById('authStatus');
  const toggleBtn = document.getElementById('authToggleBtn');
  const logoutBtn = document.getElementById('authLogoutBtn');
  const loginForm = document.getElementById('authLoginForm');
  if(detail.loggedIn){
    statusEl.textContent = `Editing as ${detail.email}`;
    toggleBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
    loginForm.style.display = 'none';
  } else {
    statusEl.textContent = 'Viewing (read-only)';
    toggleBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
  }
}

window.addEventListener('chel-auth-changed', (e) => {
  chelUpdateAuthUI(e.detail);
  renderMilestones();
  renderIssues();
});

let buildStepsState = {};
let partsStateCache = {};
let resolvedIssueIds = [];

function loadBuildSteps(){
  window.chelFirebase.onBuildStepsChange((data) => {
    buildStepsState = data || {};
    renderMilestones();
    renderProgress();
  });
}

function loadPartsStateCache(){
  window.chelFirebase.onPartsStateChange((data) => {
    partsStateCache = data || {};
    renderMilestones();
  });
}

function loadResolvedIssues(){
  window.chelFirebase.onResolvedIssuesChange((arr) => {
    resolvedIssueIds = arr || [];
    renderIssues();
  });
}

function allSteps(){
  const out = [];
  milestones.forEach(m => m.steps.forEach(s => out.push(s)));
  return out;
}

async function toggleStep(stepId, val){
  buildStepsState[stepId] = val;
  renderMilestones();
  renderProgress();
  const ok = await window.chelFirebase.setBuildSteps(buildStepsState);
  if(!ok) alert('Save failed — your last change may not have been stored. Try again.');
}

function renderProgress(){
  const steps = allSteps();
  const total = steps.length;
  const done = steps.filter(s => buildStepsState[s.id]).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressSub').textContent = `${done} / ${total} steps complete`;
}

const milestoneOpenState = {};
document.addEventListener('toggle', (e) => {
  const key = e.target && e.target.dataset ? e.target.dataset.milestoneKey : null;
  if(key) milestoneOpenState[key] = e.target.open;
}, true);

function partsCountForStep(step){
  if(!step.linkedParts || !step.linkedParts.length) return null;
  const total = step.linkedParts.length;
  const have = step.linkedParts.filter(pid => partsStateCache[pid] && partsStateCache[pid].purchased).length;
  return {have, total};
}

function renderMilestones(){
  const el = document.getElementById('milestonesList');
  el.innerHTML = milestones.map(m => {
    const done = m.steps.filter(s => buildStepsState[s.id]).length;
    const total = m.steps.length;
    const isOpen = !!milestoneOpenState[m.id];
    const editable = !!window.chelIsEditor;
    const dis = editable ? '' : 'disabled';
    return `<details class="milestone" data-milestone-key="${m.id}" ${isOpen ? 'open' : ''}>
      <summary>${m.num}) ${m.name}<span class="milestone-meta ${done===total?'done':''}">${done}/${total} steps</span></summary>
      <div class="milestone-content">
        ${m.steps.map(s => {
          const checked = !!buildStepsState[s.id];
          const counts = partsCountForStep(s);
          let partsBtn = '';
          if(counts){
            const allDone = counts.have === counts.total;
            const popupItems = s.linkedParts.map(pid => {
              const info = partsLookup[pid];
              const have = partsStateCache[pid] && partsStateCache[pid].purchased;
              const label = info ? info.name : pid;
              return `<div class="parts-popup-item ${have?'have':''}">${label}</div>`;
            }).join('');
            partsBtn = `<span class="parts-popup-wrap">
              <a class="step-parts-btn ${allDone?'all-done':''}" href="parts-list.html?ids=${s.linkedParts.join(',')}">Show Parts (${counts.have}/${counts.total})</a>
              <div class="parts-popup">
                <div class="parts-popup-title">Needed for this step</div>
                ${popupItems}
              </div>
            </span>`;
          }
          return `<div class="step-row">
            <input type="checkbox" ${dis} ${checked?'checked':''} onchange="toggleStep('${s.id}', this.checked)">
            <div style="flex:1;">
              <div class="step-name ${checked?'done':''}">${s.name}</div>
              ${s.note ? `<div class="step-note">${s.note}</div>` : ''}
              ${partsBtn}
            </div>
          </div>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}

function renderIssues(){
  const editable = !!window.chelIsEditor;
  const active = issues.filter(i => !resolvedIssueIds.includes(i.id));
  const resolved = issues.filter(i => resolvedIssueIds.includes(i.id));

  const areas = [...new Set(active.map(i => i.area))];
  const activeHTML = areas.map(area => `
    <div class="issue-area-group">
      <div class="issue-area-title">${area}</div>
      ${active.filter(i => i.area === area).map(i => `
        <div class="issue">
          <div style="flex:1;"><b>${i.tag}</b><br>${i.text}</div>
          ${editable ? `<button class="del" style="white-space:nowrap;" onclick="toggleIssueResolved('${i.id}', true)" title="Mark resolved">✓ Resolve</button>` : ''}
        </div>
      `).join('')}
    </div>
  `).join('');

  const resolvedHTML = resolved.length ? `
    <details style="margin-top:8px;">
      <summary style="cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:0.75rem; color:var(--muted); list-style:none; padding:6px 0;">▸ Resolved (${resolved.length})</summary>
      ${resolved.map(i => `
        <div class="issue" style="opacity:0.6; border-left-color:var(--muted);">
          <div style="flex:1;"><b>${i.tag}</b><br>${i.text}</div>
          ${editable ? `<button class="del" style="white-space:nowrap;" onclick="toggleIssueResolved('${i.id}', false)" title="Move back to active">↺ Reopen</button>` : ''}
        </div>
      `).join('')}
    </details>
  ` : '';

  document.getElementById('issuesList').innerHTML = (active.length ? activeHTML : '<div class="empty">No open issues right now.</div>') + resolvedHTML;
}

async function toggleIssueResolved(id, resolve){
  if(resolve){
    if(!resolvedIssueIds.includes(id)) resolvedIssueIds.push(id);
  } else {
    resolvedIssueIds = resolvedIssueIds.filter(x => x !== id);
  }
  renderIssues();
  await window.chelFirebase.setResolvedIssues(resolvedIssueIds);
}

function chelStartApp(){
  loadBuildSteps();
  loadPartsStateCache();
  loadResolvedIssues();
}
if(window.chelFirebase){
  chelStartApp();
} else {
  window.addEventListener('chel-firebase-ready', chelStartApp, { once: true });
}
</script>
