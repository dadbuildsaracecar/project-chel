<svg width="100%" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Electrical circuit sheet index</title>
<desc>Block-level map showing how the six electrical circuit sheets relate to each other: Power Distribution and Fuse Block at the root, Ground Scheme as the common return path, and the four subsystem sheets in between.</desc>
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#c9a05c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- HEADER -->
<text x="450" y="36" font-size="19" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace" letter-spacing="1.5">CHEL ELECTRICAL &#8212; SHEET INDEX</text>
<text x="450" y="56" font-size="11" fill="#8993a1" text-anchor="middle" font-family="monospace">Six circuit sheets, one netlist &#8212; this is the map, not the wiring</text>
<line x1="30" y1="70" x2="870" y2="70" stroke="#3a4552" stroke-width="1"/>

<!-- ============ POWER DISTRIBUTION (root, top) ============ -->
<rect x="60" y="90" width="780" height="110" rx="8" fill="#242c35" stroke="#c9a05c" stroke-width="2"/>
<text x="450" y="118" font-size="15" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">POWER DISTRIBUTION &amp; FUSE BLOCK</text>
<text x="450" y="136" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Battery, ignition switch, 11 fuses, 3 relays &#8212; root of every circuit below</text>
<text x="450" y="158" font-size="9" fill="#5dcaa5" text-anchor="middle" font-family="monospace">Every sheet below draws power from here</text>
<text x="450" y="184" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">power-fuse-block.svg</text>

<line x1="245" y1="200" x2="245" y2="234" stroke="#c9a05c" stroke-width="1.5" marker-end="url(#arrB)"/>
<line x1="655" y1="200" x2="655" y2="234" stroke="#c9a05c" stroke-width="1.5" marker-end="url(#arrB)"/>

<!-- ============ ROW 1: IGNITION & CHARGING | EFI/ECU ============ -->
<rect x="60" y="240" width="370" height="150" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="245" y="266" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">IGNITION &amp; CHARGING</text>
<text x="80" y="288" font-size="9" fill="#c7cdd3" font-family="monospace">Starting circuit, alternator, 1-wire</text>
<text x="80" y="302" font-size="9" fill="#c7cdd3" font-family="monospace">charging, condensed ignition/timing</text>
<text x="80" y="316" font-size="9" fill="#c7cdd3" font-family="monospace">chain (full detail on EFI/ECU sheet)</text>
<text x="80" y="338" font-size="9" fill="#5dcaa5" font-family="monospace">Volt gauge source &#8594; Gauges &amp; Dash</text>
<text x="80" y="352" font-size="9" fill="#5dcaa5" font-family="monospace">Ignition chain &#8594; EFI/ECU sheet</text>
<text x="245" y="376" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">ignition-charging.svg</text>

<rect x="470" y="240" width="370" height="150" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="655" y="266" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">EFI/ECU INTEGRATION</text>
<text x="490" y="288" font-size="9" fill="#c7cdd3" font-family="monospace">Full pin-by-pin ECU harness, sensors,</text>
<text x="490" y="302" font-size="9" fill="#c7cdd3" font-family="monospace">injectors, distributor, 6EFI, coil, tach</text>
<text x="490" y="316" font-size="9" fill="#c7cdd3" font-family="monospace">&#8212; the deepest-detail sheet of the six</text>
<text x="490" y="338" font-size="9" fill="#5dcaa5" font-family="monospace">Tach signal &#8594; Gauges &amp; Dash</text>
<text x="490" y="352" font-size="9" fill="#5dcaa5" font-family="monospace">Fuel pump relay &#8594; Power &amp; Fuse sheet</text>
<text x="655" y="376" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">efi-ecu-full-schematic.svg</text>

<line x1="430" y1="315" x2="465" y2="315" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#arrB)"/>
<line x1="465" y1="325" x2="430" y2="325" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#arrB)"/>

<line x1="245" y1="390" x2="245" y2="424" stroke="#c9a05c" stroke-width="1.5" marker-end="url(#arrB)"/>
<line x1="655" y1="390" x2="655" y2="424" stroke="#c9a05c" stroke-width="1.5" marker-end="url(#arrB)"/>

<!-- ============ ROW 2: GAUGES & DASH | LIGHTING ============ -->
<rect x="60" y="430" width="370" height="150" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="245" y="456" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">GAUGES &amp; DASH</text>
<text x="80" y="478" font-size="9" fill="#c7cdd3" font-family="monospace">All 8 AutoMeter Cobra gauges, dash</text>
<text x="80" y="492" font-size="9" fill="#c7cdd3" font-family="monospace">illumination, universal wiring pattern,</text>
<text x="80" y="506" font-size="9" fill="#c7cdd3" font-family="monospace">dash controls cross-referenced out</text>
<text x="80" y="528" font-size="9" fill="#5dcaa5" font-family="monospace">Dash indicators &#8596; Lighting sheet</text>
<text x="80" y="542" font-size="9" fill="#5dcaa5" font-family="monospace">Signal sources &#8596; EFI/ECU, Ign&amp;Charging</text>
<text x="245" y="566" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">gauges-dash.svg</text>

<rect x="470" y="430" width="370" height="150" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="655" y="456" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">LIGHTING</text>
<text x="490" y="478" font-size="9" fill="#c7cdd3" font-family="monospace">Front/rear lamps, turn/hazard, reverse</text>
<text x="490" y="492" font-size="9" fill="#c7cdd3" font-family="monospace">light, dash indicators, and the custom</text>
<text x="490" y="506" font-size="9" fill="#c7cdd3" font-family="monospace">racing-number-light interlock relay</text>
<text x="490" y="528" font-size="9" fill="#5dcaa5" font-family="monospace">Dash indicators &#8596; Gauges &amp; Dash</text>
<text x="490" y="542" font-size="9" fill="#5dcaa5" font-family="monospace">Reverse light fuse &#8594; Power &amp; Fuse sheet</text>
<text x="655" y="566" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">lighting.svg</text>

<line x1="430" y1="505" x2="465" y2="505" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#arrB)"/>
<line x1="465" y1="515" x2="430" y2="515" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#arrB)"/>

<line x1="245" y1="580" x2="245" y2="614" stroke="#8993a1" stroke-width="1.5" marker-end="url(#arrB)"/>
<line x1="655" y1="580" x2="655" y2="614" stroke="#8993a1" stroke-width="1.5" marker-end="url(#arrB)"/>

<!-- ============ GROUND SCHEME (foundation, bottom) ============ -->
<rect x="60" y="620" width="780" height="120" rx="8" fill="#242c35" stroke="#8993a1" stroke-width="2"/>
<text x="450" y="648" font-size="15" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">GROUND SCHEME</text>
<text x="450" y="666" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Star-ground reference &#8212; battery negative post, engine block, chassis bus</text>
<text x="450" y="688" font-size="9" fill="#e0b0a8" text-anchor="middle" font-family="monospace">Synthesized from all five other sheets, not a single netlist section</text>
<text x="450" y="708" font-size="9" fill="#c7cdd3" text-anchor="middle" font-family="monospace">Every circuit above ultimately returns here</text>
<text x="450" y="730" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">ground-scheme.svg</text>

<!-- ============ MASTER NETLIST NOTE ============ -->
<rect x="60" y="760" width="780" height="70" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1" stroke-dasharray="5 4"/>
<text x="450" y="784" font-size="11" font-weight="700" fill="#c9a05c" text-anchor="middle" font-family="monospace">Chel_Electrical_Master_Netlist.xlsx</text>
<text x="450" y="802" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">Single source of truth behind all six sheets &#8212; every diagram is generated from it, never hand-drawn independently</text>
<text x="450" y="818" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">so they can't silently drift out of sync with each other</text>

<!-- FOOTER -->
<text x="450" y="860" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">All six sheets: /images/electrical/ &#183; generated Aug 2026</text>
</svg>
