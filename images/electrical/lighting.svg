<svg width="100%" viewBox="0 0 1400 1360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lighting schematic</title>
<desc>Full wiring schematic for headlights, park lights, turn signals, brake lights, tail lights, license plate light, hazards, dash indicator lamps, and the custom racing-number light interlock relay.</desc>
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#c9a05c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- HEADER -->
<text x="700" y="42" font-size="22" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace" letter-spacing="2">LIGHTING</text>
<text x="700" y="66" font-size="13" fill="#8993a1" text-anchor="middle" font-family="monospace">FRONT &#183; REAR &#183; TURN/HAZARD &#183; DASH INDICATORS &#183; RACING NUMBER LIGHTS &#183; PRINT AT 18&#215;24</text>
<text x="1380" y="30" font-size="10" fill="#8993a1" text-anchor="end" font-family="monospace">REV 1 &#183; AUG 2026</text>
<line x1="20" y1="82" x2="1380" y2="82" stroke="#3a4552" stroke-width="1"/>

<!-- LEGEND -->
<rect x="20" y="94" width="16" height="10" rx="2" fill="#a97142"/><text x="42" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Park/running (Tan)</text>
<rect x="240" y="94" width="16" height="10" rx="2" fill="#8a5fc9"/><text x="262" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Brake (Purple)</text>
<rect x="420" y="94" width="16" height="10" rx="2" fill="#a97142" stroke="#eae6da" stroke-width="0.5"/><text x="442" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Hi/Lo beam (Brn/Red)</text>
<rect x="650" y="94" width="16" height="10" rx="2" fill="#e893c4"/><text x="672" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Hazard (Pink)</text>
<rect x="820" y="94" width="16" height="10" rx="2" fill="#5dcaa5"/><text x="842" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Turn signal (per side)</text>
<rect x="1030" y="94" width="16" height="10" rx="2" fill="#e0a340"/><text x="1052" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Custom/new</text>
<text x="1380" y="118" font-size="10" fill="#8993a1" text-anchor="end" font-family="monospace">Dash lighting: see Gauges &amp; Dash sheet</text>

<!-- ============ HEADLIGHT SWITCH ============ -->
<rect x="60" y="140" width="610" height="170" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="365" y="164" font-size="14" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">HEADLIGHT SWITCH</text>
<text x="365" y="180" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">OFF / PARK / HEADLIGHTS positions</text>
<text x="80" y="202" font-size="10" fill="#a97142" font-family="monospace">TAN-park feeds &#8594; front + rear + license lamps</text>
<text x="80" y="220" font-size="10" fill="#c7cdd3" font-family="monospace">RED-low / BRN-high beam &#8594; via dimmer switch</text>
<text x="80" y="238" font-size="10" fill="#c7cdd3" font-family="monospace">TAN-tail lt feeds &#8594; rear running lamps</text>
<text x="80" y="256" font-size="10" fill="#c7cdd3" font-family="monospace">WHT-dash lights &#8594; see Gauges &amp; Dash sheet</text>
<text x="80" y="278" font-size="9" fill="#e0b0a8" font-family="monospace">Floor/column dimmer switch physical location still</text>
<text x="80" y="292" font-size="9" fill="#e0b0a8" font-family="monospace">TBD &#8212; open item on Gauges &amp; Dash sheet</text>

<!-- ============ TURN SIGNAL / HAZARD ============ -->
<rect x="730" y="140" width="610" height="170" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="1035" y="164" font-size="14" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">TURN SIGNAL STALK &amp; FLASHERS</text>
<text x="1035" y="180" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Speedway self-canceling, pinout confirmed</text>
<text x="750" y="202" font-size="10" fill="#5dcaa5" font-family="monospace">Stalk: Yel/Red=R turn, Wht/Red=L turn out</text>
<text x="750" y="220" font-size="10" fill="#c7cdd3" font-family="monospace">GRY-TURN FLASHER FD &#8594; flasher &#8594; front+rear lamps</text>
<text x="750" y="238" font-size="10" fill="#c7cdd3" font-family="monospace">Red/Blk stripe tees into dash indicator lamps</text>
<text x="750" y="256" font-size="10" fill="#e893c4" font-family="monospace">PNK-HAZARD FLASHER &#8594; bypasses stalk, all 4 corners</text>
<text x="750" y="278" font-size="9" fill="#8993a1" font-family="monospace">Brown=ground, Brown jumper=flasher relay ground</text>
<text x="750" y="292" font-size="9" fill="#8993a1" font-family="monospace">Fully replaces FFR dash-mounted turn switch</text>

<!-- ============ FRONT LAMPS ============ -->
<rect x="60" y="340" width="1280" height="220" rx="8" fill="#242c35" stroke="#c9a05c" stroke-width="2"/>
<text x="700" y="368" font-size="15" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">FRONT LAMPS</text>
<text x="700" y="386" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Headlight buckets + front turn signals, both sides identical circuits</text>
<line x1="700" y1="398" x2="700" y2="540" stroke="#3a4552" stroke-width="1"/>

<text x="130" y="424" font-size="12" font-weight="700" fill="#c9a05c" font-family="monospace">RIGHT SIDE</text>
<text x="90" y="448" font-size="10" fill="#c7cdd3" font-family="monospace">Headlight: Brn-high beam / Red-low beam</text>
<text x="90" y="470" font-size="10" fill="#a97142" font-family="monospace">Park lamp: Tan-Rt Park Lt Fd</text>
<text x="90" y="492" font-size="10" fill="#5dcaa5" font-family="monospace">Front turn: Lt Blu-Rt Frt Turn</text>
<text x="90" y="514" font-size="9" fill="#8993a1" font-family="monospace">Dimmer switch feeds hi/lo per Headlight Switch box</text>
<text x="90" y="530" font-size="9" fill="#8993a1" font-family="monospace">above &#8212; RED-low beam / BRN-high beam</text>

<text x="770" y="424" font-size="12" font-weight="700" fill="#c9a05c" font-family="monospace">LEFT SIDE</text>
<text x="730" y="448" font-size="10" fill="#c7cdd3" font-family="monospace">Headlight: Brn-high beam / Red-low beam</text>
<text x="730" y="470" font-size="10" fill="#a97142" font-family="monospace">Park lamp: Tan-Lft Park Lt Fd</text>
<text x="730" y="492" font-size="10" fill="#5dcaa5" font-family="monospace">Front turn: Dk Grn-Left Frt Turn</text>
<text x="730" y="514" font-size="9" fill="#8993a1" font-family="monospace">Mirror image of right side &#8212; same wire types,</text>
<text x="730" y="530" font-size="9" fill="#8993a1" font-family="monospace">separate runs</text>

<!-- ============ REAR LAMPS ============ -->
<rect x="60" y="600" width="1280" height="250" rx="8" fill="#242c35" stroke="#c9a05c" stroke-width="2"/>
<text x="700" y="628" font-size="15" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">REAR LAMPS</text>
<text x="700" y="646" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Tail light housings &#8212; running, brake, and turn typically share one dual-filament bulb per side</text>
<line x1="700" y1="658" x2="700" y2="790" stroke="#3a4552" stroke-width="1"/>

<text x="130" y="684" font-size="12" font-weight="700" fill="#c9a05c" font-family="monospace">RIGHT SIDE</text>
<text x="90" y="708" font-size="10" fill="#a97142" font-family="monospace">Tail/running: Tan-Rt Tail Lt Fd</text>
<text x="90" y="730" font-size="10" fill="#8a5fc9" font-family="monospace">Brake: Purp-Right Brake Lts</text>
<text x="90" y="752" font-size="10" fill="#5dcaa5" font-family="monospace">Rear turn: Wht-Right Rear Turn</text>

<text x="770" y="684" font-size="12" font-weight="700" fill="#c9a05c" font-family="monospace">LEFT SIDE</text>
<text x="730" y="708" font-size="10" fill="#a97142" font-family="monospace">Tail/running: Tan-Lft Tail Lt Fd</text>
<text x="730" y="730" font-size="10" fill="#8a5fc9" font-family="monospace">Brake: Purp-Left Brake Lts</text>
<text x="730" y="752" font-size="10" fill="#5dcaa5" font-family="monospace">Rear turn: Yel-Left Rear Turn</text>

<text x="90" y="780" font-size="9" fill="#8993a1" font-family="monospace">Brake trigger: Brake Pedal Switch, 15A fuse &#8212; see Power &amp; Fuse Block sheet</text>

<line x1="130" y1="800" x2="1270" y2="800" stroke="#3a4552" stroke-width="0.5"/>
<text x="130" y="826" font-size="11" fill="#eae6da" font-family="monospace">LICENSE PLATE LIGHT</text>
<text x="400" y="826" font-size="10" fill="#a97142" font-family="monospace">Tan-License Plate &#8212; single lamp, off the park circuit</text>

<!-- ============ DASH INDICATORS ============ -->
<rect x="60" y="880" width="610" height="150" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="365" y="904" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">DASH INDICATOR LAMPS</text>
<text x="80" y="926" font-size="10" fill="#5dcaa5" font-family="monospace">Left turn ind: Dk Grn &#160;&#160;&#160;&#160; Hi-beam ind: Brn</text>
<text x="80" y="944" font-size="10" fill="#5dcaa5" font-family="monospace">Right turn ind: Lt Blu</text>
<text x="80" y="966" font-size="9" fill="#8993a1" font-family="monospace">Confirmed necessary &#8212; Cobra gauges have no built-in</text>
<text x="80" y="980" font-size="9" fill="#8993a1" font-family="monospace">indicators (see Gauges &amp; Dash sheet)</text>
<text x="80" y="1000" font-size="9" fill="#8993a1" font-family="monospace">Fed by turn stalk tee + dimmer switch high-beam leg</text>

<!-- ============ RACING NUMBER LIGHTS (relay logic) ============ -->
<rect x="730" y="880" width="610" height="250" rx="6" fill="#1c232b" stroke="#e0a340" stroke-width="1.5"/>
<text x="1035" y="904" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">RACING NUMBER LIGHTS &#8212; custom</text>
<text x="1035" y="920" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Illuminated door + tail numbers, AND-gate interlock</text>

<!-- relay symbol -->
<rect x="900" y="940" width="130" height="90" rx="4" fill="#242c35" stroke="#e0a340" stroke-width="1.5"/>
<text x="965" y="960" font-size="10" font-weight="700" fill="#e0a340" text-anchor="middle" font-family="monospace">RELAY</text>
<circle cx="915" cy="975" r="3" fill="#e0a340"/><text x="895" y="979" font-size="9" fill="#8993a1" text-anchor="end" font-family="monospace">85</text>
<circle cx="915" cy="1010" r="3" fill="#e0a340"/><text x="895" y="1014" font-size="9" fill="#8993a1" text-anchor="end" font-family="monospace">86</text>
<circle cx="1015" cy="975" r="3" fill="#e0a340"/><text x="1035" y="979" font-size="9" fill="#8993a1" font-family="monospace">30</text>
<circle cx="1015" cy="1010" r="3" fill="#e0a340"/><text x="1035" y="1014" font-size="9" fill="#8993a1" font-family="monospace">87</text>
<line x1="915" y1="978" x2="915" y2="1007" stroke="#e0a340" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="1015" y1="978" x2="1015" y2="1007" stroke="#e0a340" stroke-width="1"/>

<text x="750" y="965" font-size="9" fill="#a97142" font-family="monospace">Park Lt &#8594; coil (85/86)</text>
<line x1="755" y1="975" x2="900" y2="975" stroke="#a97142" stroke-width="1.5" marker-end="url(#arrB)"/>
<text x="750" y="1000" font-size="9" fill="#e0a340" font-family="monospace">Aux LT sw &#8594; common (30)</text>
<line x1="755" y1="1010" x2="900" y2="1010" stroke="#e0a340" stroke-width="1.5" marker-end="url(#arrB)"/>
<line x1="1030" y1="990" x2="1080" y2="990" stroke="#e0a340" stroke-width="1.5" marker-end="url(#arrB)"/>
<text x="1090" y="980" font-size="9" fill="#c7cdd3" font-family="monospace">&#8594; Number</text>
<text x="1090" y="994" font-size="9" fill="#c7cdd3" font-family="monospace">lamps (door</text>
<text x="1090" y="1008" font-size="9" fill="#c7cdd3" font-family="monospace">L/R + tail)</text>

<text x="750" y="1052" font-size="9" fill="#8993a1" font-family="monospace">Both conditions required &#8212; no diodes needed</text>
<text x="750" y="1068" font-size="9" fill="#8993a1" font-family="monospace">Hardware: reuses FFR's now-vacant fuel pump relay</text>
<text x="750" y="1082" font-size="9" fill="#8993a1" font-family="monospace">socket (Holley pump runs its own relay at battery)</text>
<text x="750" y="1098" font-size="9" fill="#e0b0a8" font-family="monospace">Fuse amperage TBD &#8212; pending lamp wattage at purchase</text>
<text x="750" y="1114" font-size="9" fill="#8993a1" font-family="monospace">Lamp style similar to license plate light per Aaron</text>

<!-- ============ REVERSE LIGHT (new circuit) ============ -->
<rect x="60" y="1150" width="1280" height="150" rx="6" fill="#1c232b" stroke="#e0a340" stroke-width="1.5"/>
<text x="700" y="1174" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">REVERSE LIGHT &#8212; new circuit</text>
<text x="700" y="1190" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Not a stock FFR circuit &#8212; triggered off the TKX transmission</text>

<text x="90" y="1214" font-size="10" fill="#e0a340" font-family="monospace">DK BLUE-REVERSE LT</text>
<text x="230" y="1214" font-size="10" fill="#c7cdd3" font-family="monospace">&#8212; unused color in this harness, no conflict risk</text>
<text x="90" y="1234" font-size="10" fill="#c7cdd3" font-family="monospace">New inline 5A fuse (IGN FED bus, switched &#8212; matches convention of</text>
<text x="90" y="1250" font-size="10" fill="#c7cdd3" font-family="monospace">reverse lights only live with key on) &#8594; TKX reverse lockout switch</text>
<text x="90" y="1266" font-size="10" fill="#c7cdd3" font-family="monospace">(single-pole, closes when reverse selected) &#8594; DK BLUE-REVERSE LT</text>
<text x="90" y="1282" font-size="9" fill="#8993a1" font-family="monospace">Bundle physically with brake light wiring in the rear harness run per Aaron.</text>
<text x="700" y="1282" font-size="9" fill="#e0b0a8" font-family="monospace">No spare fuse position on the FFR block &#8212; needs its own add-a-fuse tap</text>

