<text x="840" y="404" font-size="12" font-weight="700" fill="#eae6da" font-family="monospace">VOLT GAUGE (AutoMeter Cobra) &#8212; charge indicator</text>
<text x="840" y="422" font-size="10" fill="#c7cdd3" font-family="monospace">&#8216;I&#8217; terminal &#8594; SWITCHED 12V (post-key-switch), NEVER</text>
<text x="840" y="438" font-size="10" fill="#c7cdd3" font-family="monospace">direct to battery or alternator output (AutoMeter warning)</text>
<text x="840" y="456" font-size="9" fill="#8993a1" font-family="monospace">White/Black dash-light pair per universal gauge pattern</text>

