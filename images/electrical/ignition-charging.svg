<!-- ============ STARTER SOLENOID -> MOTOR ============ -->
<rect x="460" y="350" width="300" height="100" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="610" y="374" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">STARTER SOLENOID</text>
<text x="480" y="394" font-size="10" fill="#c7cdd3" font-family="monospace">Trigger: Red, unfused, from BAT term</text>
<text x="480" y="410" font-size="10" fill="#c7cdd3" font-family="monospace">Engages starter motor pinion</text>
<text x="480" y="426" font-size="9" fill="#8993a1" font-family="monospace">Heavy battery cable passes through when engaged</text>

<line x1="610" y1="450" x2="610" y2="480" stroke="#d9534f" stroke-width="2" marker-end="url(#arrB)"/>

<rect x="460" y="480" width="300" height="100" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="610" y="504" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">STARTER MOTOR</text>
<text x="480" y="524" font-size="10" fill="#c7cdd3" font-family="monospace">Heavy battery cable + dedicated ground strap</text>
<text x="480" y="540" font-size="9" fill="#8993a1" font-family="monospace">Cable gauge/length per FFR kit hardware &#8212; not</text>
<text x="480" y="554" font-size="9" fill="#8993a1" font-family="monospace">individually itemized in the electrical netlist</text>

<!-- ============ CRANK-ONLY BRANCH ============ -->
<rect x="460" y="620" width="300" height="130" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="610" y="644" font-size="13" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">CRANK-ONLY (START term)</text>
<text x="480" y="666" font-size="10" fill="#c7cdd3" font-family="monospace">EFI Crank Power (Lt Blue)</text>
<text x="480" y="681" font-size="9" fill="#5dcaa5" font-family="monospace">RESOLVED &#8212; unused. Terminator X takes run</text>
<text x="480" y="694" font-size="9" fill="#5dcaa5" font-family="monospace">power from switched +12V instead (see EFI sheet)</text>
<text x="480" y="716" font-size="10" fill="#c7cdd3" font-family="monospace">Clutch Safety Switch (Lt Blue)</text>
<text x="480" y="731" font-size="9" fill="#8993a1" font-family="monospace">Neutral/clutch safety interlock, stock</text>

<!-- ============ ALTERNATOR ============ -->
<rect x="820" y="140" width="520" height="220" rx="6" fill="#1c232b" stroke="#5dcaa5" stroke-width="1.5"/>
<text x="1080" y="164" font-size="14" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">ALTERNATOR</text>
<text x="1080" y="180" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">Powermaster 8-57140 &#8212; 150A, 1-wire</text>
<line x1="835" y1="192" x2="1325" y2="192" stroke="#3a4552" stroke-width="0.5"/>
<text x="840" y="214" font-size="10" fill="#5dcaa5" font-family="monospace">B+ output &#8594; Battery, charging feed (Red, 8AWG)</text>
<text x="840" y="234" font-size="10" fill="#c7cdd3" font-family="monospace">Ground &#8594; engine block (case-grounded, internal reg.)</text>

<rect x="840" y="250" width="480" height="95" rx="5" fill="#1c232b" stroke="#5dcaa5" stroke-width="1"/>
<text x="860" y="272" font-size="11" font-weight="700" fill="#5dcaa5" font-family="monospace">RESOLVED &#8212; 1-wire, self-exciting</text>
<text x="860" y="292" font-size="10" fill="#c7cdd3" font-family="monospace">No ignition excite wire needed. BRN-ALTERNATOR IGN</text>
<text x="860" y="308" font-size="10" fill="#c7cdd3" font-family="monospace">(Ignition Switch ACC term) is NOT used &#8212; cap and</text>
<text x="860" y="324" font-size="10" fill="#c7cdd3" font-family="monospace">tuck into loom, same treatment as the choke circuit</text>
<text x="860" y="338" font-size="9" fill="#8993a1" font-family="monospace">Charge wire: 8 AWG recommended (7ft included with unit)</text>

<path d="M820 214 L400 214 L400 252 L380 252" fill="none" stroke="#5dcaa5" stroke-width="1.5" marker-end="url(#arrB)"/>

