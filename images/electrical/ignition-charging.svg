<text x="80" y="463" font-size="11" fill="#eae6da" font-family="monospace">START term</text>
<text x="80" y="478" font-size="9" fill="#8993a1" font-family="monospace">Lt Blue, crank-only &#8594; see below</text>

<text x="80" y="520" font-size="9" fill="#8993a1" font-family="monospace">ACC / IGNITION terms &amp; fuse buses:</text>
