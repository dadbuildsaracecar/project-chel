<!-- ============ BATTERY ============ -->
<rect x="60" y="140" width="320" height="150" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="220" y="164" font-size="14" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">BATTERY</text>
<text x="220" y="180" font-size="10" fill="#8993a1" text-anchor="middle" font-family="monospace">12V primary source</text>
<text x="80" y="200" font-size="10" fill="#c7cdd3" font-family="monospace">+ post &#8594; Ignition Switch BAT term (Red)</text>
<text x="80" y="216" font-size="10" fill="#c7cdd3" font-family="monospace">+ post &#8594; Starter Solenoid (heavy, direct)</text>
<text x="80" y="232" font-size="10" fill="#c7cdd3" font-family="monospace">&#8722; post &#8594; engine block &amp; chassis ground</text>
<text x="80" y="252" font-size="10" fill="#5dcaa5" font-family="monospace">&#8592; Alternator B+ charging feed (Red, direct)</text>
<text x="80" y="270" font-size="9" fill="#8993a1" font-family="monospace">BAT FED fuse bus tap: see Power &amp; Fuse Block sheet</text>

