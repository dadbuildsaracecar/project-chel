<text x="700" y="66" font-size="13" fill="#8993a1" text-anchor="middle" font-family="monospace">STARTING CIRCUIT &#183; CHARGING CIRCUIT &#183; PRINT AT 18&#215;24 OR LARGER</text>
<text x="1380" y="30" font-size="10" fill="#8993a1" text-anchor="end" font-family="monospace">REV 1 &#183; AUG 2026</text>
