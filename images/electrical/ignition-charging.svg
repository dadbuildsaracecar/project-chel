<title>Ignition and Charging schematic</title>
<desc>Full wiring schematic for the starting circuit (battery, ignition switch, starter solenoid and motor), the charging circuit (alternator, 1-wire vs 3-wire decision), and a condensed ignition-timing summary that cross-references the full-detail EFI/ECU Integration sheet.</desc>
