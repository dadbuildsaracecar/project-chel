<rect x="470" y="94" width="16" height="10" rx="2" fill="#5dcaa5"/><text x="492" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Charging output / resolved</text>
<rect x="750" y="94" width="16" height="10" rx="2" fill="#b8302a" stroke="#e0b0a8" stroke-width="0.5" stroke-dasharray="2 2"/><text x="772" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Critical / not used</text>
