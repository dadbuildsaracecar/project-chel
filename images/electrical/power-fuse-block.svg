<text x="80" y="216" font-size="10" fill="#c7cdd3" font-family="monospace">&#8594; Ignition Switch BAT term</text>
<text x="80" y="232" font-size="10" fill="#5dcaa5" font-family="monospace">&#8592; Alternator charging feed (Red)</text>

