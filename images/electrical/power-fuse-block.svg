<text x="570" y="1090" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">TURN SIGNAL</text>
<text x="570" y="1106" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">10A &#8212; feeds flasher &#8594;</text>
<line x1="720" y1="1105" x2="760" y2="1105" stroke="#e0a340" stroke-width="1.5" marker-end="url(#arrB)"/>

<!-- ============ DESTINATION BOXES (right column) ============ -->
<rect x="760" y="248" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="271" font-size="12" fill="#eae6da" font-family="monospace">HEADLIGHT SW / RADIO MEMORY / COURTESY LT</text>
<text x="780" y="288" font-size="9" fill="#8993a1" font-family="monospace">Always-hot circuit &#8212; stock, no changes</text>

<rect x="760" y="318" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="341" font-size="12" fill="#eae6da" font-family="monospace">BRAKE PEDAL SWITCH</text>
<text x="780" y="358" font-size="9" fill="#8993a1" font-family="monospace">Stock, no changes</text>

<rect x="760" y="388" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="411" font-size="12" fill="#eae6da" font-family="monospace">HORN RELAY &#8594; HORN</text>
<text x="780" y="428" font-size="9" fill="#8993a1" font-family="monospace">Coil trigger: Brn-Horn SW / output: Dk Grn-Horn</text>

<rect x="760" y="458" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="481" font-size="12" fill="#eae6da" font-family="monospace">COOLING FAN RELAY &#8594; FAN</text>
<text x="780" y="498" font-size="9" fill="#8993a1" font-family="monospace">Thermostat-switch controlled per FFR manual</text>

<rect x="760" y="558" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="581" font-size="12" fill="#eae6da" font-family="monospace">DASH GAUGES / RADIO</text>
<text x="780" y="598" font-size="9" fill="#e0b0a8" font-family="monospace">Verify AutoMeter Cobra full-set current draw vs 10A</text>

<rect x="760" y="628" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="651" font-size="12" fill="#eae6da" font-family="monospace">WIPER MOTOR</text>
<text x="780" y="668" font-size="9" fill="#8993a1" font-family="monospace">Stock, no changes</text>

<rect x="760" y="698" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="721" font-size="12" fill="#eae6da" font-family="monospace">VINTAGE AIR GEN 5 MINI &#8212; blower</text>
<text x="780" y="738" font-size="9" fill="#e0b0a8" font-family="monospace">Verify blower draw vs stock 20A fuse before wiring</text>

<rect x="760" y="798" width="700" height="95" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="821" font-size="12" font-weight="700" fill="#eae6da" font-family="monospace">FFR FUEL PUMP RELAY &#8212; chassis-mounted</text>
<text x="780" y="839" font-size="10" fill="#c7cdd3" font-family="monospace">Superseded &#8212; Holley Terminator X now runs the Walbro</text>
<text x="780" y="855" font-size="10" fill="#c7cdd3" font-family="monospace">255 off its own dedicated relay/fuse (see EFI/ECU sheet)</text>
<text x="780" y="875" font-size="10" fill="#5dcaa5" font-family="monospace">This relay socket &amp; fuse position now repurposed for the</text>
<text x="780" y="891" font-size="10" fill="#5dcaa5" font-family="monospace">racing-number light interlock relay (Electrical flag 12)</text>

<rect x="760" y="903" width="700" height="95" rx="5" fill="#1c232b" stroke="#5dcaa5" stroke-width="1.5"/>
<text x="780" y="926" font-size="12" font-weight="700" fill="#eae6da" font-family="monospace">ECU SWITCHED +12V IN (Terminator X, pin A10)</text>
<text x="780" y="944" font-size="10" fill="#5dcaa5" font-family="monospace">RESOLVED &#8212; this fuse only feeds the ECU's low-current</text>
<text x="780" y="960" font-size="10" fill="#5dcaa5" font-family="monospace">key-on logic wire. ECU main power and injector/pump power</text>
<text x="780" y="976" font-size="10" fill="#5dcaa5" font-family="monospace">are separate, direct-to-battery fused circuits (see EFI sheet)</text>
<text x="780" y="992" font-size="9" fill="#8993a1" font-family="monospace">&#8212; stock 15A fuse has plenty of headroom, no upgrade needed</text>

<rect x="760" y="1008" width="700" height="55" rx="5" fill="#2a1f1e" stroke="#b8302a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="780" y="1031" font-size="12" fill="#e0b0a8" font-family="monospace">CHOKE &#8212; capped, tucked into loom</text>
<text x="780" y="1048" font-size="9" fill="#e0b0a8" font-family="monospace">No choke on EFI build &#8212; kept only for a future carb swap</text>

<rect x="760" y="1078" width="700" height="55" rx="5" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="780" y="1101" font-size="12" fill="#eae6da" font-family="monospace">TURN SIGNAL FLASHER &#8594; Speedway self-canceling stalk</text>
<text x="780" y="1118" font-size="9" fill="#8993a1" font-family="monospace">Confirmed pinout on steering column sheet (see index)</text>

<!-- ============ INERTIA SWITCH (below fuse block, related to fuel pump) ============ -->
<rect x="420" y="1170" width="300" height="80" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="570" y="1194" font-size="12" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">INERTIA SWITCH</text>
<text x="440" y="1214" font-size="9" fill="#c7cdd3" font-family="monospace">Fuel pump safety cutoff, in series w/ pump feed</text>
<text x="440" y="1230" font-size="9" fill="#e0b0a8" font-family="monospace">Must be pushed &#8220;on&#8221; &#8212; common no-start culprit</text>
<line x1="570" y1="1150" x2="570" y2="1170" stroke="#e0a340" stroke-width="1.5" marker-end="url(#arrB)"/>

