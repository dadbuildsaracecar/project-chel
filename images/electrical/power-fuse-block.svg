<line x1="720" y1="345" x2="760" y2="345" stroke="#d9534f" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="570" y="408" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">HORN</text>
<text x="570" y="424" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">15A &#8212; via Horn Relay</text>
<line x1="720" y1="415" x2="760" y2="415" stroke="#d9534f" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="570" y="478" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">COOLING FAN</text>
<text x="570" y="494" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">30A &#8212; Dk Blue, thermostat</text>
<line x1="720" y1="485" x2="760" y2="485" stroke="#d9534f" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="570" y="528" font-size="11" font-weight="700" fill="#a97142" text-anchor="middle" font-family="monospace">ACC FED BUS &#8212; accessory pos.</text>
<line x1="435" y1="540" x2="705" y2="540" stroke="#3a4552" stroke-width="0.5"/>

<text x="570" y="578" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">GAUGE FD / RADIO IGN</text>
<text x="570" y="594" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">10A &#8212; Brown</text>
<line x1="720" y1="585" x2="760" y2="585" stroke="#a97142" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="570" y="648" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">WIPER</text>
<text x="570" y="664" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">10A &#8212; Purple</text>
<line x1="720" y1="655" x2="760" y2="655" stroke="#a97142" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="570" y="718" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">HEATER</text>
<text x="570" y="734" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">20A &#8212; Brown, Vintage Air</text>
<line x1="720" y1="725" x2="760" y2="725" stroke="#a97142" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="570" y="765" font-size="11" font-weight="700" fill="#e0a340" text-anchor="middle" font-family="monospace">IGN FED BUS &#8212; run position</text>
<text x="570" y="778" font-size="7.5" fill="#8993a1" text-anchor="middle" font-family="monospace">+ Reverse Light tap, new &#8212; see Lighting sheet</text>
<line x1="435" y1="785" x2="705" y2="785" stroke="#3a4552" stroke-width="0.5"/>

<text x="570" y="830" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">FUEL PUMP</text>
<text x="570" y="846" font-size="9" fill="#8993a1" text-anchor="middle" font-family="monospace">15A &#8212; Tan, see note &#8594;</text>
<line x1="720" y1="845" x2="760" y2="845" stroke="#e0a340" stroke-width="1.5" marker-end="url(#arrB)"/>

<text x="570" y="935" font-size="11" fill="#eae6da" text-anchor="middle" font-family="monospace">EFI OR COIL</text>
<text x="570" y="951" font-size="9" fill="#5dcaa5" text-anchor="middle" font-family="monospace">15A &#8212; Orange, RESOLVED &#8594;</text>
