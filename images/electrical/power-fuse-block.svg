<!-- ============ STARTER SOLENOID + ALTERNATOR (top right) ============ -->
<rect x="760" y="140" width="380" height="80" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="950" y="163" font-size="12" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">STARTER SOLENOID</text>
<text x="780" y="182" font-size="9" fill="#8993a1" font-family="monospace">&#9668; Ignition Switch BAT term (Red, unfused)</text>
<text x="780" y="198" font-size="9" fill="#8993a1" font-family="monospace">Heavy feed, direct to solenoid &#8212; not fused</text>

<rect x="1160" y="140" width="380" height="80" rx="6" fill="#1c232b" stroke="#3a4552" stroke-width="1"/>
<text x="1350" y="163" font-size="12" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace">ALTERNATOR</text>
<text x="1180" y="182" font-size="9" fill="#8993a1" font-family="monospace">&#8594; Battery, charging feed (Red, direct)</text>
<text x="1180" y="198" font-size="9" fill="#e0b0a8" font-family="monospace">&#9668; ACC term ign excite &#8212; skip if 1-wire alt</text>

