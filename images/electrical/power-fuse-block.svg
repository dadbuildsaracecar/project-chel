<svg width="100%" viewBox="0 0 1600 1420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Power Distribution and Fuse Block schematic</title>
<desc>Full wiring schematic for the FFR chassis fuse block, showing battery, ignition switch terminals, the three fused-power buses, all eleven fuses with amperage and wire color, the three relays, starter solenoid, and alternator.</desc>
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#c9a05c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- HEADER -->
<text x="800" y="42" font-size="22" font-weight="700" fill="#eae6da" text-anchor="middle" font-family="monospace" letter-spacing="2">POWER DISTRIBUTION &amp; FUSE BLOCK</text>
<text x="800" y="66" font-size="13" fill="#8993a1" text-anchor="middle" font-family="monospace">FFR CHASSIS HARNESS REV W &#8212; PG.32 &#183; PRINT AT 24&#215;18 OR LARGER</text>
<text x="1580" y="30" font-size="10" fill="#8993a1" text-anchor="end" font-family="monospace">REV 1 &#183; AUG 2026</text>
<line x1="20" y1="82" x2="1580" y2="82" stroke="#3a4552" stroke-width="1"/>

<!-- LEGEND -->
<rect x="20" y="94" width="16" height="10" rx="2" fill="#d9534f"/><text x="42" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Battery direct (always hot)</text>
<rect x="290" y="94" width="16" height="10" rx="2" fill="#a97142"/><text x="312" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">ACC FED (accessory pos.)</text>
<rect x="550" y="94" width="16" height="10" rx="2" fill="#e0a340"/><text x="572" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">IGN FED (run position)</text>
<rect x="800" y="94" width="16" height="10" rx="2" fill="#3f7fb8"/><text x="822" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Crank-only (START)</text>
<rect x="1020" y="94" width="16" height="10" rx="2" fill="#b8302a" stroke="#e0b0a8" stroke-width="0.5" stroke-dasharray="2 2"/><text x="1042" y="103" font-size="11" fill="#c7cdd3" font-family="monospace">Not used / flagged</text>
<text x="1580" y="103" font-size="10" fill="#8993a1" text-anchor="end" font-family="monospace">Crossing w/o dot = no connection</text>

