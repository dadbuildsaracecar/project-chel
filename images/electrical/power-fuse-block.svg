<text x="790" y="1323" font-size="10" fill="#e0b0a8" text-anchor="middle" font-family="monospace">Confirm actual AutoMeter Cobra gauge-set draw vs GAUGE FD (10A) and Vintage Air blower draw vs HEATER (20A) before final crimp.</text>

